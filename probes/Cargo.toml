# 探针目录册：全部一次性/取证探针的唯一存放处，按领域分类（见 README.md）。
# 每个探针 = 一个 cargo example；新增探针 = 加文件 + 在对应分类下补一个 [[example]]。
[package]
name = "probes"
description = "SimCity 资源探针集（DBPF/属性/locale/贴花/地块/区域/模型/UI/运行时）"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
dbpf = { path = "../crates/dbpf" }
rw4 = { path = "../crates/rw4" }
sc-properties = { path = "../crates/sc-properties" }
sc-exporter = { path = "../crates/sc-exporter" }
sc-registry = { path = "../crates/sc-registry" }
image.workspace = true
base64.workspace = true
serde.workspace = true
serde_json = "1"
flate2 = "1"

[[example]]
name = "building_economy_audit"
path = "property/building_economy_audit.rs"

