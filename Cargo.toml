[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/dbpf",
    "crates/rw4",
    "crates/sc-properties",
    "crates/sc-registry",
    "crates/sc-exporter",
    "crates/sc-format",
    "crates/sc-store",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
memmap2 = "0.9"
lru = "0.12"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1.11"

[profile.release]
strip = true
lto = true
