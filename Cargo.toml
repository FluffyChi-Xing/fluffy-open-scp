[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/dbpf",
    "crates/rw4",
    "crates/sc-properties",
    "crates/sc-exporter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
byteorder = "1"

[profile.release]
strip = true
lto = true
