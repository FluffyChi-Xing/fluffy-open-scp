[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/dbpf",
    "crates/rw4",
    "crates/sc-properties",
    "crates/sc-registry",
    "crates/sc-exporter",
    "crates/sc-shader",
    "crates/sc-format",
    "crates/sc-store",
    "probes",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
memmap2 = "0.9"
lru = "0.12"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1.11"

# tauri dev 用 debug 构建：依赖全量 -O0 时（rusqlite/image/tauri…）启动变慢。
# 依赖开 O2、本地 crate 保留 O1 + 精简调试信息，增量编译与断点仍可用。
[profile.dev]
opt-level = 1
debug = "line-tables-only"
# Tauri's repeated dev relinks can retain stale LLVM anonymous symbols when
# incremental codegen units are reused across interrupted builds.
incremental = false

[profile.dev.package."*"]
opt-level = 2

# libsqlite3-sys builds the bundled sqlite3.c through cc-rs.  With any Rust
# debug level enabled cc-rs adds MSVC /Z7, which can fail with D8050 when the
# compiler cannot create its C debug record (often mistaken for an ACL error).
# Keep Rust line tables for our crates, but never ask this C dependency to emit
# a debug record.  This makes clean and incremental Windows builds deterministic.
[profile.dev.package.libsqlite3-sys]
debug = false

[profile.release]
strip = true
lto = true
