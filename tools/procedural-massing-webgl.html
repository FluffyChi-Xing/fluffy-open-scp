<!doctype html><meta charset="utf-8"><title>Procedural material probe</title>
<style>body{background:#20252b;color:#eee;font:14px monospace}main{display:flex;flex-wrap:wrap}pre{white-space:pre-wrap}canvas{width:600px;height:600px}</style>
<main></main><pre id="status">Running real extracted assets through the production building4 shader…</pre>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {GLTFExporter} from '/node_modules/three/examples/jsm/exporters/GLTFExporter.js';
import {analyzeBuildingMaterial} from '/src/lib/procedural-building/propertyMaterial.ts';
import {buildModelPayload} from '/src/lib/procedural-building/meshBuilder.ts';
import {generateBuildingParts} from '/src/lib/procedural-building/generator.ts';
import {DEFAULT_PARAMETERS} from '/src/lib/procedural-building/schema.ts';
import {parseLotModelObjects} from '/src/lib/three-gltf.ts';
import {getTintTextures,makeTintMaterial,createSunEnv,applySunEnv} from '/src/pages/packages/components/property-editor/refinedRender.ts';
import {massPreset} from '/src/lib/procedural-building/massing.ts';
const report=[]; const failures=[];
console.error=(...args)=>{failures.push(args.map(String).join(' ')); document.querySelector('#status').textContent=JSON.stringify({report,failures},null,2)};
try {
const id = '4a8f5ef9';
 const path='/tmp/procedural_roof/4a8f5ef9-full/';
 const mesh=await (await fetch(path+'mesh.json')).json();
 const meta=await (await fetch(path+'params.json')).json();
 const png=async n=>new Uint8Array(await (await fetch(path+'slot'+n+'.png')).arrayBuffer());
 const geometry=new THREE.BufferGeometry();
 for (const [key,size,data] of [
 ['position',3,mesh.vertices.flatMap(v=>v.position)],
 ['uv1',4,mesh.vertices.flatMap(v=>[v.column/255,0.25,0,0])],
 ['uv2',2,mesh.vertices.flatMap(v=>v.uv.slice(0,2))],
 ['uv3',2,mesh.vertices.flatMap(v=>v.uv.slice(2,4))]]) geometry.setAttribute(key,new THREE.Float32BufferAttribute(data,size));
 geometry.setIndex(mesh.triangles.flat());geometry.computeVertexNormals();
 const glb=await new GLTFExporter().parseAsync(new THREE.Mesh(geometry,new THREE.MeshStandardMaterial()),{binary:true});
 const material={baseColorPng:null,slot0Png:null,normalPng:await png(2),roughnessPng:null,aoPng:null,tintPng:await png(1),palettePng:await png(4),shaderPng:await png(3),interiorPng:await png(5),reliefPng:null,paramsF32:new Float32Array(meta.values.flat()),paramCols:meta.width};
 const source=await analyzeBuildingMaterial({glbs:[glb],materials:[material],meshMaterialIndices:[0],meshUvKinds:[2],diagnostics:''});
 if(source.facade.windowCoverage<0) throw new Error(id+': no visible facade windows');
 if(id==='10daf7bf' && source.facade.column===0) throw new Error('Brick-only column selected');
 if(id==='1d261fdd' && source.facade.column!==7) throw new Error('Dominant Base glass facade lost');
 for(const variant of ['source','single','y','courtyard','roof']) {
 const mass=massPreset(variant==='y'?'y':variant==='courtyard'?'courtyard':'single');
 if(variant==='single') {mass.blocks[0].size=[180,140,360]; mass.blocks[0].center=[0,0,180];}
 if(variant==='roof') {mass.blocks[0].size=[36,36,4]; mass.blocks[0].center=[0,0,2];}
 const generated=variant==='source'?source.payload:await buildModelPayload({parts:generateBuildingParts({...DEFAULT_PARAMETERS,blockMass:mass},123),buildingMaterial:source});
 const scene=new THREE.Scene();scene.background=new THREE.Color('#303a45');
 const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(600,600);renderer.outputColorSpace=THREE.SRGBColorSpace;
 const camera=new THREE.PerspectiveCamera(40,1,0.1,1000);camera.up.set(0,0,1);camera.position.set(40,-48,32);camera.lookAt(0,0,10);
 scene.add(new THREE.HemisphereLight(0xcce4ff,0x887766,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(15,-25,40);scene.add(light);
 const env=createSunEnv(THREE);applySunEnv(env,12,true);
 const textures=await getTintTextures(THREE,generated,renderer.capabilities.getMaxAnisotropy());
 const objects=await parseLotModelObjects(generated.glbs);
 objects.forEach((root,index)=>{root.traverse(object=>{if(object.isMesh) object.material=generated.meshUvKinds[index]===2?makeTintMaterial(THREE,textures[generated.meshMaterialIndices[index]],env)[0]:new THREE.MeshStandardMaterial({vertexColors:true});});scene.add(root)});
 const box=new THREE.Box3();objects.forEach(root=>box.expandByObject(root)); const center=box.getCenter(new THREE.Vector3());const size=box.getSize(new THREE.Vector3());const radius=size.length()/2;camera.far=radius*20;camera.near=.1; camera.position.copy(center).add(new THREE.Vector3(1,-1.3,1.5).normalize().multiplyScalar(radius/Math.sin(THREE.MathUtils.degToRad(20))*1.15));camera.lookAt(center);camera.updateProjectionMatrix();
 const article=document.createElement('article'); const title=document.createElement('p');title.textContent=meta.property_tgi+' '+variant;article.append(title,renderer.domElement);document.querySelector('main').append(article);
 renderer.render(scene,camera);
 report.push({id,variant,facade:source.facade,roof:source.roof,meshes:generated.glbs.length,triangles:renderer.info.render.triangles,programs:renderer.info.programs.map(p=>({runnable:p.diagnostics?.runnable??true}))});
}
document.querySelector('#status').textContent=JSON.stringify({report,failures},null,2);
} catch(error){document.querySelector('#status').textContent=error.stack;}
</script>
