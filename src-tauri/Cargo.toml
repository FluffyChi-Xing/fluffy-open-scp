[package]
name = "fluffy-open-scp"
description = "OpenSCP — SimCity (2013) package explorer, Tauri app shell"
edition.workspace = true
version.workspace = true
license.workspace = true
autobins = false
default-run = "fluffy-open-scp"

[[bin]]
name = "fluffy-open-scp"
path = "src/main.rs"

# M5 无头构建 CLI（build-pipeline-observability-20261105.md §5）：绕开 app
# 外壳，以 schema 文件直接驱动 asset_build_m1 责任链；结果 JSON 打到 stdout。
[[bin]]
name = "openscp-build"
path = "src/bin/openscp_build.rs"

[lib]
name = "fluffy_open_scp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

dbpf = { path = "../crates/dbpf" }
rw4 = { path = "../crates/rw4" }
sc-properties = { path = "../crates/sc-properties" }
sc-exporter = { path = "../crates/sc-exporter" }
sc-store = { path = "../crates/sc-store" }
sc-registry = { path = "../crates/sc-registry" }
thiserror.workspace = true
sha2 = "0.10"
base64.workspace = true
image.workspace = true
flate2 = "1"
tauri-plugin-dialog = "^2"
