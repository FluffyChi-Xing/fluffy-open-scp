name: "💡 功能建议 / Feature Request"
description: "建议新功能或改进 / Suggest an idea or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！方向性的大功能建议先在 Issue 里讨论达成共识，再动手实现。
        Ideas welcome! For significant features, please reach consensus in the discussion here before implementing.
  - type: textarea
    id: problem
    attributes:
      label: "问题与动机 / Problem & motivation"
      description: "你想解决什么问题？当前的工作流卡在哪里？/ What problem are you trying to solve?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "期望方案 / Proposed solution"
      description: "你希望它如何工作？/ How would you like it to work?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "备选方案 / Alternatives considered"
  - type: dropdown
    id: layer
    attributes:
      label: "所属层级 / Layer"
      description: "见 README 的三层目标 / See the three-layer goal in README"
      options:
        - "格式底座 crates (Format foundation: DBPF / RW4 / 属性表解析与写回)"
        - "资源工作台 UI (Resource workbench UI)"
        - "Modding Suite (声明式模组工作流 / declarative modding workflow)"
        - "文档与探针 (Docs & reverse-engineering probes)"
        - "其他 (Other)"
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: "参与意愿 / Willingness to contribute"
      options:
        - label: "我愿意提交实现此功能的 PR / I am willing to submit a PR implementing this"
